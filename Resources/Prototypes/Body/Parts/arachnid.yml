- type: entity
  id: PartArachnid
  parent: BaseItem
  name: "arachnid body part"
  abstract: true
  components:
  - type: Surgery
    openedDamage:
      types:
        Blunt: 5
    necrosisDamage:
      types:
        Cellular: 5
    incisorShockDamage:
      types:
        Asphyxiation: 20
    smallClampShockDamage:
      types:
        Asphyxiation: 0
    largeClampShockDamage:
      types:
        Asphyxiation: 0
    sawShockDamage:
      types:
        Asphyxiation: 75
    drillShockDamage:
      types:
        Asphyxiation: 25
    sutureShockDamage:
      types:
        Asphyxiation: 10
    hardSutureShockDamage:
      types:
        Asphyxiation: 15
    cauterizerShockDamage:
      types:
        Asphyxiation: 15
    manipulatorShockDamage:
      types:
        Asphyxiation: 10
    retractorShockDamage:
      types:
        Asphyxiation: 10
    cellularRejectionDamage:
      types:
        Cellular: 10
    compatibleSpecies:
      - arachnid
  - type: UserInterface
    interfaces:
      - key: enum.SurgeryUiKey.Key
        type: SurgeryBoundUserInterface
  - type: Damageable
    damageContainer: Biological
  - type: BodyPart
    species: arachnid
    integrity: 50
    maxIntegrity: 50
    hitChance: 1
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []
      attachment: !type:Container
        ents: []
      slotAttachment: !type:Container
        ents: []
  - type: StaticPrice
    price: 100

- type: entity
  id: TorsoArachnid
  name: "arachnid torso"
  parent: PartArachnid
  components:
  - type: BiopressHarvest
    id: Creature
    totalReagentUnits: 30
  - type: Sprite
    netsync: false
    sprite: Mobs/Species/Arachnid/parts.rsi
    state: "torso_m"
  - type: Icon
    sprite: Mobs/Species/Arachnid/parts.rsi
    state: "torso_m"
  - type: BodyPart
    partType: Torso
    incisable: true
    container: true
    endoSkeleton: false # Spider
    integrity: 100
    maxIntegrity: 100
    hitChance: 9
    
- type: entity
  id: HeadArachnid
  name: "arachnid head"
  parent: PartArachnid
  components:
  - type: BiopressHarvest
    id: Creature
    totalReagentUnits: 3
  - type: Sprite
    netsync: false
    sprite: Mobs/Species/Arachnid/parts.rsi
    state: "head_icon"
  - type: Icon
    sprite: Mobs/Species/Arachnid/parts.rsi
    state: "head_icon"
  - type: BodyPart
    partType: Head
    incisable: true
    container: true
    endoSkeleton: false # Spider
    vital: true
  - type: Input
    context: "ghost"
  - type: MovementSpeedModifier
    baseWalkSpeed: 0
    baseSprintSpeed: 0
  - type: InputMover
  - type: GhostOnMove
  - type: Tag
    tags:
      - Head

