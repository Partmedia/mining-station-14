- type: entity
  save: false
  name: Urist McWeb
  parent: BaseMobOrganic
  id: BaseMobArachnid
  abstract: true
  components:
  # The important nessessities
  - type: Body
    prototype: Arachnid
    requiredLegs: 2
  - type: Perishable
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Arachnid # spooder
  - type: Hunger
    starvationDamage:
      types:
        Heat: 0.5
        Asphyxiation: 0.5 
  - type: Icon
    sprite: Mobs/Species/Arachnid/parts.rsi
    state: full
  - type: Hunger
    baseDecayRate: 0.05 # Probably faster than humans?
  - type: Thirst
  - type: DiseaseCarrier
    diseaseResist: 0.1
  # Damage and speed
  - type: Vocal
    sounds:
      Male: Arachnid
      Female: Arachnid
      Unsexed: Arachnid
  - type: Bloodstream
    bloodReagent: SpiderBlood
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.7
    baseSprintSpeed : 4.5
  - type: ThermalRegulator
    normalBodyTemperature: 310.15
    implicitHeatRegulation: 0
    sweatHeatRegulation: 5
    shiveringHeatRegulation: 150
  - type: Temperature
    heatDamageThreshold: 400
    coldDamageThreshold: 285
    currentTemperature: 310.15
    specificHeat: 250
    coldDamage:
      types:
        Cold : 0.6 #per second, scales with temperature & other constants
    heatDamage:
      types:
        Heat : 0.7 #per second, scales with temperature & other constants
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.20 #per second, scales with pressure and other constants.
  - type: SlowOnDamage
    speedModifierThresholds: # This is an ouch, but it does make up for their extra speed
      65: 0.6
      80: 0.4
  # Misc
  - type: Speech
    speechSounds: Arachnid
  - type: Inventory
    templateId: arachnid
  - type: MeleeWeapon
    hidden: true
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    angle: 30
    animation: WeaponArcClaw
    attackRate: 1.5
    damage:
      types:
        Slash: 3
        Poison: 1
  - type: Butcherable
    butcheringType: Spike
    spawned:
      - id: FoodMeatSpider
        amount: 5

- type: entity
  save: false
  name: Urist McWeb
  parent: MobHumanDummy
  id: MobArachnidDummy
  noSpawn: true
  description: A dummy arachnid meant to be used in character setup. # Hey! It's not dumb ::0(
  components:
  - type: Inventory
    templateId: arachnid

